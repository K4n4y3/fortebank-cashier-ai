# Каталог типов нарушений: единый источник для модели (ml/cashier) и API/UI (app/).
#
# sources — только проверенные ссылки на акты РК. Тексты сверены по зеркалу zakon.uchet.kz
# (adilet.zan.kz отдаёт текст через JS); перед сдачей стоит ещё раз открыть пункты на adilet.
#   basis: "прямое требование" — пункт прямо регулирует наблюдаемое действие;
#          "трактовка" — пункт регулирует близкую норму, связь с видео — наша интерпретация.
#
# Акты:
#   [231] Постановление Правления Национального Банка РК от 29.11.2019 № 231 «Об утверждении Правил
#         осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках
#         второго уровня...» (ред. на 12.07.2026). https://adilet.zan.kz/rus/docs/V1900019680
#   [14]  Постановление Правления Национального Банка РК от 24.02.2020 № 14 «Об утверждении Правил
#         организации охраны и устройства помещений банков второго уровня...» (ред. на 24.12.2024).
#         https://adilet.zan.kz/rus/docs/V2000020075

types:
  T1:
    name: "Оставление рабочего места без обеспечения сохранности ценностей"
    why: "Кассир покидает рабочее место, оставив наличные или ценности (в т. ч. инкассаторскую сумку) на столе без присмотра либо открытый сейф."
    look_for: "cashier leaves the room or the frame while the safe door is open or cash/cash bag remains on the desk"
    sources:
      - document: "Правила кассовых операций (пост. Правления НБРК № 231 от 29.11.2019)"
        clause: "п. 20"
        quote: "Все ранее принятые наличные деньги хранятся в специальных устройствах, находящихся на рабочем месте кассового работника, закрывающихся на ключ"
        url: "https://adilet.zan.kz/rus/docs/V1900019680"
        basis: "прямое требование"
      - document: "Правила кассовых операций (пост. Правления НБРК № 231 от 29.11.2019)"
        clause: "п. 22"
        quote: "Кассовому работнику не допускается покидать рабочее место до окончания обслуживания клиента."
        url: "https://adilet.zan.kz/rus/docs/V1900019680"
        basis: "прямое требование (если уход во время обслуживания)"
  T2:
    name: "Посторонний в кассовом помещении при открытых ценностях"
    why: "В кассовое помещение входит человек (в т. ч. следующий клиент), пока наличные лежат открыто или кассир работает с наличными другого клиента."
    look_for: "an additional person enters the cash room while cash is open on the desk or being handled"
    sources:
      - document: "Правила кассовых операций (пост. Правления НБРК № 231 от 29.11.2019)"
        clause: "п. 20"
        quote: "Все ранее принятые наличные деньги хранятся в специальных устройствах ... закрывающихся на ключ"
        url: "https://adilet.zan.kz/rus/docs/V1900019680"
        basis: "трактовка"
      - document: "Правила организации охраны и устройства помещений (пост. Правления НБРК № 14 от 24.02.2020)"
        clause: "п. 8"
        quote: "кассовый узел изолирован ... одним закрывающимся служебным входом"
        url: "https://adilet.zan.kz/rus/docs/V2000020075"
        basis: "трактовка"
  T3:
    name: "Дверь кассового помещения не закрыта"
    why: "Во время работы с наличными вход в кассовое помещение остаётся открытым."
    look_for: "the door of the cash room stays open while the cashier works with cash"
    sources:
      - document: "Правила организации охраны и устройства помещений (пост. Правления НБРК № 14 от 24.02.2020)"
        clause: "п. 8, подп. 1) п. 16"
        quote: "изолирован ... одним закрывающимся служебным входом; отдельный вход с закрывающейся на замок дверью"
        url: "https://adilet.zan.kz/rus/docs/V2000020075"
        basis: "трактовка (норма об устройстве помещения)"
  T4:
    name: "Мобильный телефон на рабочем месте кассира"
    why: "Кассир пользуется смартфоном в кассовом узле; в кассовый узел допускаются только средства связи без функции фото- и видеофиксации."
    look_for: "the cashier holds or uses a smartphone at the workplace"
    sources:
      - document: "Правила кассовых операций (пост. Правления НБРК № 231 от 29.11.2019)"
        clause: "п. 12"
        quote: "Допускается внос работниками банка в кассовый узел ... средств связи, не имеющих функции фото и видео фиксации"
        url: "https://adilet.zan.kz/rus/docs/V1900019680"
        basis: "прямое требование (для смартфона с камерой)"
  T5:
    name: "Приём пищи или напитков на рабочем месте кассира"
    why: "Кассир ест или пьёт за столом с наличными; перечень предметов, допускаемых в кассовый узел, продукты не включает."
    look_for: "the cashier drinks or eats at the desk with cash"
    sources:
      - document: "Правила кассовых операций (пост. Правления НБРК № 231 от 29.11.2019)"
        clause: "п. 12"
        quote: "Допускается внос работниками банка в кассовый узел лекарственных средств, медицинских изделий и средств связи..."
        url: "https://adilet.zan.kz/rus/docs/V1900019680"
        basis: "трактовка"
  T6:
    name: "Личные вещи на рабочем месте кассира"
    why: "На рабочем столе кассового узла находятся личные вещи работника (сумка, одежда)."
    look_for: "personal bag or clothing is placed on the cash desk"
    sources:
      - document: "Правила кассовых операций (пост. Правления НБРК № 231 от 29.11.2019)"
        clause: "п. 12"
        quote: "Хранение личных вещей, наличных денег и ценностей работников банка осуществляется вне кассового узла"
        url: "https://adilet.zan.kz/rus/docs/V1900019680"
        basis: "прямое требование"
  T7:
    name: "Нарушение порядка приёма сумки от инкассатора"
    why: "Сумка с наличными передаётся, а инкассатор уходит до того, как кассир проверил её целостность и пломбирование."
    look_for: "a cash-in-transit courier hands over a cash bag and leaves before the cashier checks it"
    sources:
      - document: "Правила кассовых операций (пост. Правления НБРК № 231 от 29.11.2019)"
        clause: "подп. 3), 4) п. 24; п. 25"
        quote: "проверяет целостность сумки; проверяет правильность пломбирования сумки; ... в присутствии работника подразделения инкассации ... вскрывает и пересчитывает"
        url: "https://adilet.zan.kz/rus/docs/V1900019680"
        basis: "трактовка"
  T8:
    name: "Подозрительные манипуляции с наличными"
    why: "Купюра перемещается к одежде или телу кассира, а не на стол, в счётную машину или хранилище."
    look_for: "the cashier moves a banknote towards her clothes, sleeve or pocket"
    sources:
      - document: "Правила кассовых операций (пост. Правления НБРК № 231 от 29.11.2019)"
        clause: "п. 12, п. 20"
        quote: "Хранение ... наличных денег ... работников банка осуществляется вне кассового узла; ранее принятые наличные деньги хранятся в специальных устройствах"
        url: "https://adilet.zan.kz/rus/docs/V1900019680"
        basis: "трактовка"
  T9:
    name: "Не проведена идентификация клиента"
    why: "Наличные принимаются или выдаются без видимого предъявления документа, удостоверяющего личность (или цифрового документа)."
    look_for: "cash is accepted from or paid to a client without the client first showing an ID"
    sources:
      - document: "Правила кассовых операций (пост. Правления НБРК № 231 от 29.11.2019)"
        clause: "подп. 1) п. 19 (приём), подп. 1) п. 31 (выдача)"
        quote: "проводит визуальную идентификацию клиента ... с документом, удостоверяющим его личность, либо данными ... полученными посредством сервиса цифровых документов"
        url: "https://adilet.zan.kz/rus/docs/V1900019680"
        basis: "прямое требование"
  T10:
    name: "Клиент покинул кассу до завершения пересчёта"
    why: "Посетитель уходит, пока кассир ещё пересчитывает его наличные; пересчёт должен вестись в присутствии клиента."
    look_for: "the client walks away while the cashier is still counting"
    sources:
      - document: "Правила кассовых операций (пост. Правления НБРК № 231 от 29.11.2019)"
        clause: "п. 20"
        quote: "Наличные деньги принимаются и пересчитываются кассовым работником в присутствии клиента."
        url: "https://adilet.zan.kz/rus/docs/V1900019680"
        basis: "прямое требование"
  T11:
    name: "Смешение наличных разных клиентов"
    why: "Наличные предыдущей операции не убраны в хранилище, наличные следующего клиента принимаются поверх них."
    look_for: "previous client's cash stays on the desk and the next client's cash is put on top"
    sources:
      - document: "Правила кассовых операций (пост. Правления НБРК № 231 от 29.11.2019)"
        clause: "п. 20, п. 21"
        quote: "ранее принятые наличные деньги хранятся в специальных устройствах ... закрывающихся на ключ; ... принимает наличные деньги по каждому приходному кассовому документу отдельно"
        url: "https://adilet.zan.kz/rus/docs/V1900019680"
        basis: "трактовка"
  T12:
    name: "Возврат наличных клиенту после пересчёта (требует сверки)"
    why: "После пересчёта кассир возвращает часть наличных клиенту. Это допустимо, только если внесено больше заявленного; по видео сумму не проверить — нужна сверка человеком."
    look_for: "after counting, the cashier hands part of the cash back to the client"
    sources:
      - document: "Правила кассовых операций (пост. Правления НБРК № 231 от 29.11.2019)"
        clause: "подп. 4) п. 19"
        quote: "сверяет соответствие суммы, указанной в приходном кассовом документе, с общей суммой фактически принятых наличных денег"
        url: "https://adilet.zan.kz/rus/docs/V1900019680"
        basis: "трактовка (требуется проверка документов)"
  T13:
    name: "Ключ от сейфа оставлен без присмотра"
    why: "Кассир запирает сейф и уходит, оставив ключ в замке, вместо того чтобы держать ключи при себе."
    look_for: "after locking the safe the cashier walks away with empty hands and a key stays in the safe lock"
    sources:
      - document: "Правила кассовых операций (пост. Правления НБРК № 231 от 29.11.2019)"
        clause: "п. 20"
        quote: "наличные деньги хранятся в специальных устройствах, находящихся на рабочем месте кассового работника, закрывающихся на ключ ... (металлический шкаф, сейф...)"
        url: "https://adilet.zan.kz/rus/docs/V1900019680"
        basis: "трактовка"
      - document: "Правила кассовых операций (пост. Правления НБРК № 231 от 29.11.2019)"
        clause: "п. 76, п. 80"
        quote: "Ключи и (или) коды ... от двери кладовой ... хранятся у лиц, ответственных за сохранность наличных денег; порядок хранения ... ключей определяется внутренними документами банка"
        url: "https://adilet.zan.kz/rus/docs/V1900019680"
        basis: "трактовка (п. 76 — о ключах кладовой/сейфовой комнаты)"
  OTHER:
    name: "Иное возможное нарушение кассовой дисциплины"
    why: "Наблюдаемое действие может противоречить требованиям к ведению кассовых операций; требуется проверка человеком."
    look_for: "any other visible breach of cash handling or cash-room security"
    sources: []
